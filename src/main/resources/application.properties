spring.application.name=spring-demo-170
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/matrix-170
spring.datasource.username=postgres
spring.datasource.password=Feride
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Sorğudakı '?' parametrlərinin real dəyərlərini (log səviyyəsində) göstərsin
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE